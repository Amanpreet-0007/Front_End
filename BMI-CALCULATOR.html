<html>

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title >BMI Calculator</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src = "BMI-CALCULATOR.js"></script>
    </head>
    <body>
        <h1 class="text-red-500 text-5xl text-center"> What is your BMI?</h1>
        <br>
        <br>
        <div class = "text-center text-2xl">
        <label for="weight"> Please Enter Weight (in kg):</label>
        </div>
        <div class="text-center">
        <input type="number" id="weight" placeholder="Enter Weight" class="text-center">
        </div>
        <br>
        <br>
        <div class = "text-center text-2xl">
        <label for="height"> Please enter height:</label>
        </div>
        <div class="text-center">
        <input type="number" id="height" placeholder="Enter Height" class="text-center">
        </div>
        <br>
        <br>
        <div class="text-center text-xl">
        <button onclick="calculateBMI()" class = "text-center"> Calculate</button>
        <p id="result" class="text-center font-bold "></p>
        </div>
        <!--[if lt IE 7]>
